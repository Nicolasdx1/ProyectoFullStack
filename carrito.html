<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Performance Skate Shop</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/carrito.css">
</head>

<body class="carrito-page">

    <!-- Encabezado -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="usuario.html#inicio">
                    <img src="img/img_nav.PNG"
                        alt="Logo de la tienda"
                        class="logo-img">
                </a>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="usuario.html#inicio">Inicio</a>
                </li>

                <li class="nav-item">
                    <a href="usuario.html#tienda">Tienda</a>
                </li>

                <li class="nav-item">
                    <a href="carrito.html">
                        <i class="fas fa-shopping-cart"></i>
                        Carrito (<span id="contador-carrito">0</span>)
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>

        <section id="carrito">
            <div class="container">

                <h1 class="section-title">Mi Carrito</h1>

                <!-- Productos -->
                <div id="carrito-container"></div>

                <!-- Resumen -->
                <div id="carrito-resumen">

                    <h2>Resumen de compra</h2>

                    <p>
                        Productos:
                        <span id="cantidad-productos">0</span>
                    </p>

                    <p>
                        Total:
                        $<span id="total-carrito">0</span>
                    </p>

                    <div class="carrito-acciones">

                        <button
                            id="vaciar-carrito"
                            type="button">
                            <i class="fas fa-trash"></i>
                            Vaciar carrito
                        </button>

                        <button
                            id="confirmar-compra"
                            type="button">
                            <i class="fas fa-check"></i>
                            Confirmar compra
                        </button>

                    </div>

                </div>

            </div>
        </section>

    </main>

    <script src="js/carrito.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Performance Skate Shop</title>
    <link rel="stylesheet" href="styles/Main.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <a href="usuario.html" class="back-home">&larr; Volver a la tienda</a>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login">Iniciar Sesión</button>
                <button class="tab-btn" id="tab-register">Registrarse</button>
            </div>

            <!-- Formulario de Iniciar Sesión -->
            <form id="form-login" class="auth-form active">
                <h2>Bienvenido de vuelta</h2>
                <div class="input-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="tu@email.com">
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-main auth-btn">Ingresar</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" class="auth-form">
                <h2>Crea tu cuenta</h2>
                <div class="input-group">
                    <label for="reg-name">Nombre Completo</label>
                    <input type="text" id="reg-name" required placeholder="Tu Nombre">
                </div>
                <div class="input-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="tu@email.com">
                </div>
                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-main auth-btn">Crear Cuenta</button>
            </form>
        </div>
    </div>
    <script src="js/usuario.js"></script>
</body>
</html>
